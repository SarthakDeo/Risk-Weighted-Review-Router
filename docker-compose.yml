version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: risk-router-db
    environment:
      POSTGRES_DB: risk_router
      POSTGRES_USER: riskuser
      POSTGRES_PASSWORD: riskpass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
